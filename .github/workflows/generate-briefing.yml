
name: Generate WEBTOON Pulse AI Briefing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              'https://generativelanguage.googleapis.com/v1beta/models',
              headers={'x-goog-api-key': os.environ['GEMINI_API_KEY']}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              data = json.load(response)

          for model in data.get('models', []):
              if 'generateContent' in model.get('supportedGenerationMethods', []):
                  print(model['name'])
          PY

      - name: Test Gemini connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = (
              'https://generativelanguage.googleapis.com/v1beta/'
              'models/gemini-3.5-flash:generateContent'
          )
          body = {
              'contents': [
                  {'parts': [{'text': '한국어로 안녕하세요 한 문장만 써줘.'}]}
              ]
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'x-goog-api-key': os.environ['GEMINI_API_KEY']
              },
              method='POST'
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              print('TEST SUCCESS')
              print(json.dumps(data, ensure_ascii=False)[:800])
          except urllib.error.HTTPError as exc:
              print('TEST HTTP ERROR:', exc.code)
              print(exc.read().decode('utf-8', errors='replace')[:800])
          except Exception as exc:
              print('TEST CONNECTION ERROR:', type(exc).__name__)
          PY

      - name: Generate AI briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python scripts/generate_briefing.py

      - name: Commit generated briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          if git diff --cached --quiet; then
            echo "No changes to briefing"
          else
            git commit -m "Update AI market briefing"
            git push origin HEAD:main
          fi
