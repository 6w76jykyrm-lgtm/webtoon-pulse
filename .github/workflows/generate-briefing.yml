
name: Generate WEBTOON Pulse AI Briefing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              'https://generativelanguage.googleapis.com/v1beta/models',
              headers={'x-goog-api-key': os.environ['GEMINI_API_KEY']}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              data = json.load(response)

          for model in data.get('models', []):
              if 'generateContent' in model.get('supportedGenerationMethods', []):
                  print(model['name'])
          PY

      - name: Generate AI briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/generate_briefing.py

      - name: Commit generated briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          if git diff --cached --quiet; then
            echo "No changes to briefing"
          else
            git commit -m "Update AI market briefing"
            git push origin HEAD:main
          fi
