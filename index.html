/* ================= LIVE RSS DATA ================= */
function useNewsFeed(){
  const [feed,setFeed]=useState({articles:[],updatedAt:null,status:"loading"});
  useEffect(()=>{
    let active=true;
    fetch("./data/news.json?ts="+Date.now(),{cache:"no-store"})
      .then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()})
      .then(d=>{
        if(!active)return;
        const articles=(Array.isArray(d.articles)?d.articles:[])
          .filter(a=>a.url&&a.title&&a.publishedAt)
          .map(a=>({...a,real:true,rss:true,titleKo:a.titleKo||a.title,
            summary:a.summary||"RSS 제목·링크만 수집됨. 기사 본문 미검증.",
            collectedAt:d.updatedAt||"미확인",dup:1}));
        setFeed({articles,updatedAt:d.updatedAt||null,status:"loaded"});
      })
      .catch(()=>{if(active)setFeed({articles:[],updatedAt:null,status:"error"})});
    return()=>{active=false};
  },[]);
  return feed;
}
function rssDate(value){
  if(!value)return "미확인";
  const d=new Date(value);
  return Number.isNaN(d.getTime())?"미확인":new Intl.DateTimeFormat("ko-KR",{
    timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hour12:false
  }).format(d)+" KST";
}

function useWidth(){
  const ref=useRef(null);const [w,setW]=useState(640);
  useEffect(()=>{
    if(!ref.current)return;
    const ro=new ResizeObserver(e=>setW(Math.max(280,Math.floor(e[0].contentRect.width))));
    ro.observe(ref.current);return()=>ro.disconnect();
  },[]);
  return [ref,w];
}

/* ================= 차트 (직접 그린 SVG) ================= */
function LineChart({data,keys,events=[],height=320}){
  const [ref,w]=useWidth();
  const [hover,setHover]=useState(null);
  const H=w<480?Math.min(height,260):height;
  const m={t:16,r:14,b:26,l:34};
  const iw=w-m.l-m.r, ih=H-m.t-m.b;
  const x=i=>m.l+(data.length<2?0:i*iw/(data.length-1));
  const y=v=>m.t+ih-(v/100)*ih;
  const ticks=[0,25,50,75,100];
  const xl=[];const n=Math.min(w<480?4:7,data.length);
  for(let i=0;i<n;i++){xl.push(Math.round(i*(data.length-1)/Math.max(1,n-1)))}
  const snap=d=>{let b=0,bd=1e18;data.forEach((p,i)=>{const dd=Math.abs(new Date(p.date)-new Date(d));if(dd<bd){bd=dd;b=i}});return b};
  const inRange=d=>d>=data[0].date&&d<=data[data.length-1].date;
  const onMove=e=>{
    const r=e.currentTarget.getBoundingClientRect();
    const px=(e.clientX-r.left)*(w/r.width);
    const i=Math.round((px-m.l)/(iw/Math.max(1,data.length-1)));
    setHover(Math.max(0,Math.min(data.length-1,i)));
  };
  const hp=hover!==null?data[hover]:null;
  const tipLeft=hp?Math.min(w-150,Math.max(4,x(hover)+12)):0;
  return (
    <div className="chartbox" ref={ref}>
      <svg viewBox={`0 0 ${w} ${H}`} role="img" aria-label="키워드별 검색 관심도 추이 (DEMO)" onMouseMove={onMove} onMouseLeave={()=>setHover(null)} onTouchMove={e=>onMove(e.touches[0])} onTouchEnd={()=>setHover(null)}>
        {ticks.map(t=>(<g key={t}><line x1={m.l} x2={w-m.r} y1={y(t)} y2={y(t)} stroke="var(--line)" fill="none"/><text x={m.l-6} y={y(t)+4} textAnchor="end" fontSize="10" fill="var(--faint)">{t}</text></g>))}
        {xl.map(i=>(<text key={i} x={x(i)} y={H-8} textAnchor={i===0?"start":i===data.length-1?"end":"middle"} fontSize="10" fill="var(--faint)">{data[i].date.slice(5)}</text>))}
        {events.filter(e=>inRange(e.date)).map(e=>{const i=snap(e.date);return(<g key={e.date}><line x1={x(i)} x2={x(i)} y1={m.t} y2={m.t+ih} stroke="#f59e0b" strokeDasharray="4 3" fill="none"/><circle cx={x(i)} cy={m.t} r="4" fill="#f59e0b"/></g>)})}
        {keys.map(k=>{
          const d=data.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p[k.id]).toFixed(1)}`).join(" ");
          const last=data[data.length-1][k.id];
          return(<g key={k.id}><path d={d} stroke={k.color} strokeWidth="2.2" fill="none" strokeLinejoin="round" strokeLinecap="round"/><circle cx={x(data.length-1)} cy={y(last)} r="3.5" fill={k.color}/></g>);
        })}
        {hp&&(<g><line x1={x(hover)} x2={x(hover)} y1={m.t} y2={m.t+ih} stroke="var(--muted)" fill="none"/>{keys.map(k=>(<circle key={k.id} cx={x(hover)} cy={y(hp[k.id])} r="4" fill={k.color} stroke="var(--surface)" strokeWidth="1.5"/>))}</g>)}
      </svg>
      {hp&&(<div className="tip num" style={{left:tipLeft,top:8}}>
        <div style={{color:"#9db0d0"}}><span>{hp.date}</span><span>DEMO</span></div>
        {keys.map(k=>(<div key={k.id}><span><i style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:k.color,marginRight:6}}/>{k.label}</span><b>{hp[k.id]}</b></div>))}
      </div>)}
    </div>
  );
}

function Spark({data,id,color}){
  const w=120,h=30;
  const vals=data.map(p=>p[id]);const mn=Math.min(...vals),mx=Math.max(...vals);
  const pts=vals.map((v,i)=>`${(i*(w-6)/(vals.length-1)+3).toFixed(1)},${(h-4-(v-mn)/(mx-mn||1)*(h-8)).toFixed(1)}`);
  const lastP=pts[pts.length-1].split(",");
  return(<svg viewBox={`0 0 ${w} ${h}`} width="100%" height="30" aria-hidden="true"><polyline points={pts.join(" ")} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/><circle cx={lastP[0]} cy={lastP[1]} r="3" fill={color}/></svg>);
}

function HBars({rows,color="var(--accent)",unit="%"}){
  const mx=Math.max(...rows.map(r=>r[1]));
  return(<div style={{display:"grid",gap:9}}>{rows.map(([l,v])=>(
    <div key={l} style={{display:"grid",gridTemplateColumns:"minmax(86px,120px) minmax(0,1fr) 38px",gap:8,alignItems:"center",fontSize:12}}>
      <span style={{color:"var(--muted)"}}>{l}</span>
      <div style={{background:"var(--line)",borderRadius:99,height:10}}><div style={{width:(v/mx*100)+"%",background:color,height:10,borderRadius:99}}/></div>
      <b className="num" style={{textAlign:"right"}}>{v}{unit}</b>
    </div>))}</div>);
}

      <div className="toolbar">

        <div className="group"><label>기간</label>{PERIODS.map(p=>(<button key={p.id} className={"chip"+(period===p.id?" on":"")} onClick={()=>setPeriod(p.id)} aria-pressed={period===p.id}>{p.label}</button>))}</div>
      </div>
      <div className="group" style={{marginTop:10}}><label>키워드</label>{KEYWORDS.map(k=>{const on=sel.includes(k.id);return(
        <button key={k.id} className="chip" aria-pressed={on} onClick={()=>toggle(k.id)} style={on?{background:k.color,borderColor:k.color,color:"#fff"}:{}}>{k.label}</button>)})}</div>
    </Card>
    <Card className="" title={`키워드별 관심도 · ${COUNTRIES.find(c=>c.id===country).label} · 최근 ${PERIODS.find(p=>p.id===period).label}`} right={<Demo/>}>
      <div style={{marginTop:2}}/>
      <LineChart data={data} keys={keys} events={EVENTS}/>
      <div className="meta" style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:6}}>{keys.map(k=>(<span key={k.id}><i style={{display:"inline-block",width:10,height:3,background:k.color,marginRight:5,verticalAlign:"middle"}}/>{k.label}</span>))}<span><i style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"#f59e0b",marginRight:5}}/>주요 변화 시점</span></div>
      <div className="src">출처: DEMO(가상 곡선) · 기준일 {AS_OF} · 단위: 상대 관심도 지수(0–100). 그래프 위에 마우스를 올리거나 터치하면 값을 볼 수 있습니다.</div>
    </Card>
    <div className="grid g3" style={{marginTop:14}}>
      <Card title="기간 내 변화" right={<Demo/>}>
        <ul className="list">{stats.map(s=>(<li key={s.k.id} style={{display:"flex",justifyContent:"space-between",gap:8}}>
          <span>{s.k.label}</span><span className="num"><b>{s.l}</b> <span style={{color:s.d>=0?"var(--good)":"var(--bad)"}}>{s.d>=0?"+":""}{s.d}</span></span></li>))}</ul>
        <div className="src">시작 시점 대비 지수 차이</div>
      </Card>
      <Card title="주요 변화 시점" right={<Demo/>}>

        <ul className="list">{evs.map(e=>(<li key={e.date}><b className="num">{e.date}</b><div className="meta">{e.label}</div></li>))}</ul>}
      </Card>
      <Card title="관련 뉴스" right={<Real/>}>
        <ul className="list">{REAL_ARTICLES.slice(0,4).map(a=>(<li key={a.id}><a href={a.url} target="_blank" rel="noreferrer">{a.title}</a><div className="meta">{a.source} · {a.publishedAt}</div></li>))}</ul>
        <div className="src">최근 실제 뉴스입니다. DEMO 관심도 곡선과 시점을 연결하지 않았습니다.</div>
      </Card>

  </div>);

function CopyBtn({text}){
  const [s,setS]=useState("복사");
  const go=async()=>{try{await navigator.clipboard.writeText(text);setS("복사됨")}catch(e){setS("직접 선택해 복사하세요")}setTimeout(()=>setS("복사"),2000)};
  return <button className="btn" onClick={go}>{s}</button>;
}
function Competitors({feed}){

  const cnt=(id,r)=>allArticles.filter(a=>a.competitor===id&&a.real===r).length;
  return(<div>
    <Head mixed title="Competitor Watch" desc="경쟁 플랫폼별 활동 타임라인 (REAL 뉴스 + DEMO 예시)"/>

    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))"}}>{COMPETITORS.map(c=>(
      <button key={c.id} onClick={()=>setComp(comp===c.id?"all":c.id)} aria-pressed={comp===c.id} className="card" style={{textAlign:"left",borderColor:comp===c.id?"var(--accent)":"var(--line)",boxShadow:comp===c.id?"0 0 0 1px var(--accent)":"none"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,fontWeight:700}}><i style={{width:10,height:10,borderRadius:"50%",background:c.color}}/>{c.name}</div>
        <div className="meta num">REAL {cnt(c.id,true)}건 · DEMO {cnt(c.id,false)}건</div></button>))}</div>
    <Card className="">
      <div className="toolbar">
        <div className="group"><label>데이터</label>{[["real","REAL만"],["demo","DEMO만"],["all","전체"]].map(([id,l])=>(<button key={id} className={"chip"+(mode===id?" on":"")} aria-pressed={mode===id} onClick={()=>setMode(id)}>{l}</button>))}</div>
        <input id="comp-q" className="input" style={{flex:"1 1 200px"}} placeholder="제목·요약 검색" value={q} onChange={e=>setQ(e.target.value)} aria-label="검색"/>
        <select id="comp-type" className="select" value={type} onChange={e=>setType(e.target.value)} aria-label="활동 유형"><option value="all">전체 활동 유형</option>{TYPES.map(t=>(<option key={t} value={t}>{t}</option>))}</select>
        <button className="btn" onClick={()=>{setComp("all");setType("all");setQ("");setMode("real")}}>필터 초기화</button>
        <span className="meta num">{list.length}건</span>
      </div>
    </Card>
    <Card title="활동 타임라인" right={mode==="real"?<Real/>:mode==="demo"?<Demo/>:<><Real/><Demo/></>} className="">
      {list.length===0?<div className="empty">조건에 맞는 활동이 없습니다. 필터를 초기화해 보세요.</div>:

          <a href={a.url} target="_blank" rel="noreferrer" style={{color:"var(--accent)",fontWeight:600,textDecoration:"none",display:"block",marginTop:3}}>{a.rss?a.titleKo:a.title}</a>
          <div className="meta">{a.rss?a.title:a.titleKo}</div><div className="meta">{a.rss?"RSS 안내: ":a.real?"요약(Claude 작성): ":""}{a.summary}</div>
          <div className="src">출처 {a.source} · 원문 발행 {a.publishedAt} · 수집 {a.collectedAt}{a.rss?" · RSS 제목 기반 분류 · 원문 미검증 · 자동 번역은 오류 가능":a.real?" · 활동 유형은 Claude가 분류":""}</div></li>)})}</ul>}
    </Card>
    <div className="grid g2" style={{marginTop:14}}>
      <Card title="뉴스 수집 안내" right={<span className="tag infer">자동 RSS</span>}>

          <li><b>Google News RSS (작업 환경에서 호출)</b><div className="meta"><span className="fail">실패</span> · 접속이 거부되어 0건 수집</div></li>
          <li><b>Google News RSS (이 페이지에서 직접 호출)</b><div className="meta"><span className="fail">불가</span> · Artifact 페이지는 외부 서버로 요청을 보낼 수 없습니다</div></li>
          <li><b>웹 검색 후 원문 열람 (대체 방식)</b><div className="meta"><span className="ok">성공 5건</span> + 후속 검증 중 1건(r6) 추가 · 원문 열람 실패 1건은 제외 · 일회성 수동 수집이며 자동 갱신 아님</div></li>
        </ul>
        <div className="src">REAL 뉴스가 {REAL_ARTICLES.length}건뿐인 것은 시장 전체의 기사량이 아니라 이번 수집의 범위입니다.</div>
      </Card>
      <Card title="RSS 피드 구성 (Phase 2용, 미검증)" right={<span className="demo">미연결</span>}>
        <div style={{display:"grid",gap:10}}>{FEEDS.map(([n,u])=>(<div key={n}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:4}}><b>{n}</b><CopyBtn text={u}/></div><code className="code">{u}</code></div>))}</div>
        <div className="src">이 환경에서 접속할 수 없어 주소가 실제로 동작하는지는 확인하지 못했습니다. 서버에서 수집하는 단계에서 검증합니다.</div>
      </Card>

}

/* ================= 탭: CRM Strategy Lab ================= */
const KEY="wp_artifact_crm_v1";
const blank=()=>({id:"c"+Date.now(),title:"",marketSignal:"",segment:"",problem:"",hypothesis:"",action:"",abTest:"",kpi:"",requiredData:"",evidence:"",status:"아이디어"});
function CrmLab(){
  const [cards,setCards]=useState(SEED_CARDS);
  const [ready,setReady]=useState(false);
  const [q,setQ]=useState("");const [st,setSt]=useState("all");
  const [edit,setEdit]=useState(null);
  const [delId,setDelId]=useState(null);
  const [resetAsk,setResetAsk]=useState(false);
  useEffect(()=>{try{const r=localStorage.getItem(KEY);let base=r?JSON.parse(r):null;if(base){const add=SEED_CARDS.filter(c=>c.real&&!base.some(b=>b.id===c.id)&&localStorage.getItem(KEY+"_dis_"+c.id)!=="1");if(add.length)base=[...add,...base]}if(base)setCards(base)}catch(e){}setReady(true)},[]);
  useEffect(()=>{if(!ready)return;try{localStorage.setItem(KEY,JSON.stringify(cards))}catch(e){}},[cards,ready]);
  const list=useMemo(()=>cards.filter(c=>(st==="all"||c.status===st)&&(!q||JSON.stringify(c).toLowerCase().includes(q.toLowerCase()))),[cards,q,st]);
  const save=()=>{if(!edit||!edit.title.trim())return;setCards(cs=>cs.some(c=>c.id===edit.id)?cs.map(c=>c.id===edit.id?edit:c):[edit,...cs]);setEdit(null)};
  const tone=s=>s==="아이디어"?"tag gray":s==="검토"?"tag":"tag infer";
  return(<div>
    <Head title="CRM Strategy Lab" desc="시장 신호를 검증 가능한 CRM 가설로 정리합니다. 카드를 추가, 수정, 검색할 수 있습니다."/>
    <Notice>모든 카드는 <b>미검증 가설</b>입니다. 실험 결과가 없으므로 성과가 입증된 전략으로 표시하지 않습니다. 카드는 이 브라우저에만 저장되며, 저장소를 쓸 수 없는 환경에서는 창을 닫으면 사라질 수 있습니다.</Notice>
    <Card>
      <div className="toolbar">
        <input id="crm-q" className="input" style={{flex:"1 1 200px"}} placeholder="카드 검색" value={q} onChange={e=>setQ(e.target.value)} aria-label="카드 검색"/>
        <select id="crm-st" className="select" value={st} onChange={e=>setSt(e.target.value)} aria-label="상태 필터"><option value="all">전체 상태</option>{STATUSES.map(s=>(<option key={s}>{s}</option>))}</select>
        <span className="meta num">{list.length}개</span>
        <span style={{marginLeft:"auto",display:"flex",gap:8,flexWrap:"wrap"}}>
          {resetAsk?(<><span className="meta" style={{alignSelf:"center"}}>저장한 카드가 사라집니다.</span><button className="btn" onClick={()=>{setCards(SEED_CARDS);setResetAsk(false)}}>초기화 확인</button><button className="btn" onClick={()=>setResetAsk(false)}>취소</button></>):
          <button className="btn" onClick={()=>setResetAsk(true)}>DEMO 카드로 초기화</button>}
          <button className="btn pri" onClick={()=>setEdit(blank())}>+ 새 카드</button>
        </span>
      </div>
    </Card>
    <div className="cardgrid" style={{marginTop:14}}>
      {list.map(c=>(<section className="card" key={c.id}>
        <h3><span style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>{c.title}{c.title.includes("[DEMO]")&&<Demo/>}{c.real&&<span className="real">근거 REAL</span>}</span><span className={tone(c.status)}>{c.status}</span></h3>
        <dl>{FIELDS.map(([k,l])=>(<React.Fragment key={k}><dt>{l}</dt><dd>{c[k]||"—"}</dd></React.Fragment>))}</dl>
        <div style={{display:"flex",gap:8,marginTop:12}}>
          <button className="btn" onClick={()=>setEdit(c)}>수정</button>
          {delId===c.id?(<><button className="btn" style={{color:"var(--bad)"}} onClick={()=>{setCards(cs=>cs.filter(x=>x.id!==c.id));try{localStorage.setItem(KEY+"_dis_"+c.id,"1")}catch(e){}setDelId(null)}}>삭제 확인</button><button className="btn" onClick={()=>setDelId(null)}>취소</button></>):
          <button className="btn" onClick={()=>setDelId(c.id)}>삭제</button>}
        </div></section>))}
    </div>
    {list.length===0&&<div className="empty">조건에 맞는 카드가 없습니다. ‘+ 새 카드’로 가설을 추가해 보세요.</div>}
    {edit&&(<div className="modalbg" onClick={()=>setEdit(null)}><div className="modal" role="dialog" aria-modal="true" aria-label="전략 카드 편집" onClick={e=>e.stopPropagation()}>
      <h3 style={{margin:0,fontSize:16}}>전략 카드 {cards.some(c=>c.id===edit.id)?"수정":"작성"}</h3>
      <label htmlFor="f-title">제목</label><input id="f-title" className="input" value={edit.title} onChange={e=>setEdit({...edit,title:e.target.value})}/>
      {FIELDS.map(([k,l,long])=>(<div key={k}><label htmlFor={"f-"+k}>{l}</label>{long?<textarea id={"f-"+k} rows="2" className="ta" value={edit[k]} onChange={e=>setEdit({...edit,[k]:e.target.value})}/>:<input id={"f-"+k} className="input" value={edit[k]} onChange={e=>setEdit({...edit,[k]:e.target.value})}/>}</div>))}
      <label htmlFor="f-status">Status</label><select id="f-status" className="select" value={edit.status} onChange={e=>setEdit({...edit,status:e.target.value})}>{STATUSES.map(s=>(<option key={s}>{s}</option>))}</select>
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:16}}><button className="btn" onClick={()=>setEdit(null)}>취소</button><button className="btn pri" disabled={!edit.title.trim()} onClick={save}>저장</button></div>
    </div></div>)}
  </div>);
}
